	<html>
	<head>
		<meta http-equiv="Content-type" content="text/html; charset=utf-8">
		<title>Simple Lightbox Gallery</title>
		<script type="text/javascript" src="js/jquery.min.js"></script>
	    <script type="text/javascript" src="js/jquery.lightbox-0.5.min.js"></script>
		<script type="text/javascript" src="js/jquery.easy_lightbox_gallery.min.js"></script>
	</head>
	
	<style type="text/css">
		
		#div_text{
			padding-top:10px;
			font-weight:bold;
			text-size:16px;
			padding-bottom:20px;
			margin-bottom:20px;
			border-bottom:1px dashed #B5B5B5;
		}
		
		.main{			
			margin:0px auto;
			padding:0px;
			text-align:center;
			clear:both;
		}
		
		
	</style>
	<body>		
		<div align="center">
	
			<div id="div_text" align="center">
				Gallery example
			</div>
			
			<div class="main">
				<div id="gallery" align="center">Loading gallery...</div>
			</div>
			
		</div>
		
		<script type="text/javascript">	
			$("#gallery").putEasyGallery();			
		</script>
		
	</body>
</html>
